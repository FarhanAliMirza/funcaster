<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Target takeover · Funcaster</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #182821;
      color: #fff8e8;
      font: 18px system-ui;
      height: 100dvh;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }
    header,
    footer {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 14px 22px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
    }
    #hud {
      display: flex;
      gap: 25px;
      flex-wrap: wrap;
    }
    canvas {
      width: 100%;
      height: 100%;
      min-height: 0;
    }
    footer {
      font-size: 15px;
    }
    #hint {
      color: #d4dfb4;
    }
  </style>
  <header>
    <h1>Target takeover</h1>
    <div id="hud"></div>
    <b id="timer">Ready</b>
  </header>
  <canvas aria-label="Shared multiplayer game"></canvas>
  <footer>
    <span id="hint">Ready together…</span><span>✳ BOMBAY ARCADE</span>
  </footer>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="../shared/party-world-view.js"></script>
</html>
