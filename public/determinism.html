<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Kart determinism lab · Funcaster</title
  ><style>
    body {
      font: 18px system-ui;
      background: #14281f;
      color: #f7f1d7;
      max-width: 850px;
      margin: 40px auto;
      padding: 24px;
    }
    button,
    select,
    textarea {
      font: inherit;
      padding: 14px;
      margin: 10px 0;
    }
    textarea {
      width: 100%;
      min-height: 160px;
    }
    progress {
      width: 100%;
    }
  </style>
  <h1>Kart determinism lab</h1>
  <p>
    Run the same 20 full races on each device. Keep this tab open. Results are
    saved only on this device. Remote racing stays disabled until the device and
    live-network gates pass.
  </p>
  <label
    >Math mode
    <select id="mode">
      <option value="deterministic">Deterministic</option>
      <option value="native">Native Math</option>
    </select></label
  ><button id="run">Run 20 races</button
  ><progress max="20" value="0"></progress>
  <p id="status" role="status">Ready</p>
  <button id="save" disabled>Save timeline</button
  ><label
    >Compare a timeline from another browser<textarea
      id="baseline"
      placeholder="Paste timeline JSON"
    ></textarea></label
  ><button id="compare">Compare hashes</button>
  <pre id="comparison"></pre>
  <script type="module" src="/party/determinism.js"></script>
</html>
