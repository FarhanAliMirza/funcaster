<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Watch the party · Funcaster</title>
    <link rel="stylesheet" href="/party/party.css" />
    <style>
      body {
        margin: 0;
      }
      .display-toolbar {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px 24px;
        background: #faf8f1;
      }
      .display-toolbar strong {
        margin-right: auto;
      }
      .display-stage {
        position: relative;
        height: calc(100dvh - 70px);
        display: grid;
        gap: 3px;
        background: #241e3b;
      }
      .display-stage[data-count="2"],
      .display-stage[data-count="3"],
      .display-stage[data-count="4"] {
        grid-template-columns: 1fr 1fr;
      }
      .display-stage[data-count="3"],
      .display-stage[data-count="4"] {
        grid-template-rows: 1fr 1fr;
      }
      .display-stage iframe {
        width: 100%;
        height: 100%;
        border: 0;
        min-height: 0;
      }
      .display-stage canvas {
        width: 100%;
        height: 100%;
      }
      #display-loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #faf8f1;
        font-size: 1.5rem;
        pointer-events: none;
      }
      #display-note {
        padding: 8vh;
        text-align: center;
        color: #faf8f1;
        font-size: 2rem;
      }
    </style>
  </head>
  <body>
    <header class="display-toolbar">
      <a class="brand" href="/">funcaster.</a
      ><strong id="display-title">Joining the party…</strong
      ><label
        >Show
        <select id="display-seats">
          <option value="">Everyone</option>
          <option value="0">Player 1</option>
          <option value="1">Player 2</option>
          <option value="2">Player 3</option>
          <option value="3">Player 4</option>
          <option value="0,1">Players 1 + 2</option>
          <option value="2,3">Players 3 + 4</option>
        </select></label
      ><button id="display-fullscreen" class="secondary-button">
        Full screen ↗
      </button>
    </header>
    <main id="display-stage" class="display-stage">
      <p id="display-note" role="status">
        The host keeps the game running. Your screen follows along.
      </p>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/party/display.js"></script>
  </body>
</html>
